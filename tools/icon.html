<!doctype html>
<!-- 应用图标模板：tools/gen_icons.py 用无头 Edge 把它截成 512×512，再缩出其它尺寸。
     内容都在中间 60% 以内，满足安卓 maskable 图标的安全区。 -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden}
body{background:
  radial-gradient(360px 260px at 50% 18%, rgba(120,180,255,.55), transparent 70%),
  repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 22px, transparent 22px 44px),
  linear-gradient(180deg,#123a7a,#0a1f4a 60%,#061430)}
.t{position:absolute;top:196px;width:150px;height:150px;border-radius:28px;display:grid;place-items:center;
  background:linear-gradient(150deg,#fffaf0 30%,#f2e3bd);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),3px 6px 0 #c8964a,6px 12px 0 #8a5f22,8px 18px 24px rgba(0,0,0,.45)}
.t img{width:80%;height:80%}
.a{left:92px}.b{left:266px}
svg{position:absolute;inset:0}
</style></head><body>
<!-- 连线画在方块下面，两端藏在方块里 -->
<svg viewBox="0 0 512 512">
<polyline points="167,250 167,128 341,128 341,250" fill="none" stroke="rgba(255,190,40,.45)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="167,250 167,128 341,128 341,250" fill="none" stroke="#fff36b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="167,250 167,128 341,128 341,250" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="t a"><img src="../assets/tiles/strawberry.svg"></div>
<div class="t b"><img src="../assets/tiles/strawberry.svg"></div>
</body></html>
